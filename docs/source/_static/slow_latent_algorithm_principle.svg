<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 26px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 14px Arial, Helvetica, sans-serif; fill: #64748b; }
      .section { font: 700 15px Arial, Helvetica, sans-serif; letter-spacing: 0.5px; fill: #475569; }
      .label { font: 700 16px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .small { font: 400 12px Arial, Helvetica, sans-serif; fill: #475569; }
      .tiny { font: 400 11px Arial, Helvetica, sans-serif; fill: #64748b; }
      .chip { font: 700 11px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .math { font: 700 15px Arial, Helvetica, sans-serif; fill: #1e293b; }
      .box { stroke-width: 1.4; rx: 16; filter: url(#soft-shadow); }
      .inner { stroke-width: 1.2; rx: 12; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .arrow-blue { fill: none; stroke: #2563eb; stroke-width: 2.2; marker-end: url(#arrow-blue); }
      .arrow-green { fill: none; stroke: #059669; stroke-width: 2.2; marker-end: url(#arrow-green); }
      .dash { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .dash-green { fill: none; stroke: #059669; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow-green); }
      .plain-line { fill: none; stroke: #334155; stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="760"/>

  <text class="title" x="42" y="48">SlowLatent SafeStride Policy</text>
  <text class="subtitle" x="42" y="72">Deployable foot-event memory produces phase-aware stair semantics for blind humanoid locomotion.</text>

  <!-- Deployable observation panel -->
  <rect class="box" x="42" y="106" width="276" height="372" fill="#f0fdfa" stroke="#0f766e"/>
  <text class="section" x="66" y="134">DEPLOYABLE OBSERVATIONS</text>

  <rect class="inner" x="66" y="158" width="228" height="58" fill="#ccfbf1" stroke="#14b8a6"/>
  <text class="label" x="82" y="184">Proprioception</text>
  <text class="small" x="82" y="202">base state, joints, command, gait phase</text>

  <rect class="inner" x="66" y="236" width="104" height="100" fill="#ecfeff" stroke="#0891b2"/>
  <text class="label" x="82" y="262">Footprints</text>
  <text class="small" x="82" y="282">last 5</text>
  <text class="small" x="82" y="300">foot events</text>
  <ellipse cx="102" cy="318" rx="12" ry="5" fill="#0891b2" opacity="0.55"/>
  <ellipse cx="133" cy="310" rx="12" ry="5" fill="#0891b2" opacity="0.55"/>

  <rect class="inner" x="190" y="236" width="104" height="100" fill="#fff7ed" stroke="#f97316"/>
  <text class="label" x="206" y="262">Toe-riser</text>
  <text class="small" x="206" y="282">contact cue</text>
  <path d="M210 318 H235 V292 H260" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
  <circle cx="252" cy="292" r="5" fill="#f97316"/>

  <rect class="inner" x="66" y="356" width="228" height="82" fill="#dcfce7" stroke="#16a34a"/>
  <text class="label" x="82" y="382">Foot-event ratchet</text>
  <text class="small" x="82" y="402">lower / target / upper / confidence</text>
  <text class="small" x="82" y="420">online interval estimate</text>

  <rect class="inner" x="92" y="510" width="172" height="54" fill="#f8fafc" stroke="#64748b"/>
  <text class="math" x="125" y="542">latent obs x_t^L</text>
  <path class="arrow" d="M180 438 V508"/>

  <!-- Slow latent core -->
  <rect class="box" x="372" y="106" width="260" height="372" fill="#eef2ff" stroke="#4f46e5"/>
  <text class="section" x="396" y="134">SLOW LATENT CORE</text>

  <rect class="inner" x="406" y="164" width="192" height="52" fill="#e0e7ff" stroke="#6366f1"/>
  <text class="label" x="450" y="195">MLP encoder</text>

  <rect class="inner" x="406" y="244" width="192" height="62" fill="#c7d2fe" stroke="#4f46e5"/>
  <text class="label" x="462" y="270">LSTM</text>
  <text class="small" x="455" y="290">hidden h_t</text>

  <rect class="inner" x="406" y="334" width="192" height="82" fill="#eef2ff" stroke="#6366f1"/>
  <text class="label" x="428" y="360">Event-triggered gate</text>
  <text class="small" x="428" y="380">normal / write / memory</text>
  <text class="small" x="428" y="398">hold until flat exit</text>

  <path class="arrow-blue" d="M264 537 C324 537 322 190 404 190"/>
  <path class="arrow-blue" d="M502 216 V242"/>
  <path class="arrow-blue" d="M502 306 V332"/>

  <rect class="box" x="688" y="134" width="214" height="142" fill="#eff6ff" stroke="#2563eb"/>
  <text class="label" x="725" y="166">Slow memory z_t</text>
  <line x1="708" y1="204" x2="882" y2="204" stroke="#93c5fd" stroke-width="2"/>
  <text class="math" x="724" y="194">state 8-d</text>
  <text class="math" x="724" y="234">shape 16-d</text>
  <text class="small" x="724" y="258">persistent, gated, actor-visible</text>
  <path class="arrow-blue" d="M598 374 C638 374 650 205 686 205"/>

  <!-- Head panel -->
  <rect class="box" x="686" y="310" width="300" height="224" fill="#f8fafc" stroke="#64748b"/>
  <text class="section" x="710" y="338">LEARNED SEMANTIC HEADS</text>

  <rect class="inner" x="716" y="360" width="112" height="58" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="label" x="736" y="384">State</text>
  <text class="small" x="736" y="402">event, stair</text>

  <rect class="inner" x="850" y="360" width="106" height="58" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="label" x="872" y="384">Height</text>
  <text class="small" x="872" y="402">riser h</text>

  <rect class="inner" x="716" y="442" width="240" height="62" fill="#dcfce7" stroke="#16a34a"/>
  <text class="label" x="738" y="466">SafeStride heads</text>
  <text class="small" x="738" y="486">control c_t, interval [l_t, u_t], trend, confidence</text>

  <path class="arrow-blue" d="M794 276 V308"/>
  <path class="arrow-blue" d="M598 275 C640 275 646 389 714 389"/>
  <path class="arrow-blue" d="M794 276 C826 288 840 328 872 358"/>
  <path class="arrow-green" d="M794 276 C830 314 808 400 746 440"/>

  <!-- Phase-aware supervision -->
  <rect x="372" y="580" width="614" height="122" rx="18" fill="#ffffff" stroke="#059669" stroke-width="1.8" stroke-dasharray="8 6"/>
  <text class="section" x="400" y="610" fill="#047857">PHASE-AWARE SELF-SUPERVISION</text>
  <text class="small" x="400" y="634">training labels from deployable ratchet, not a direct actor shortcut</text>
  <rect x="408" y="654" width="142" height="30" rx="15" fill="#dcfce7" stroke="#16a34a"/>
  <text class="chip" x="433" y="674">PROBE: farther</text>
  <rect x="570" y="654" width="156" height="30" rx="15" fill="#ffedd5" stroke="#f97316"/>
  <text class="chip" x="590" y="674">BACKOFF: closer</text>
  <rect x="746" y="654" width="114" height="30" rx="15" fill="#e0e7ff" stroke="#6366f1"/>
  <text class="chip" x="773" y="674">LOCK: hold</text>
  <text class="small" x="884" y="674">target c_t follows ratchet target</text>
  <path class="dash-green" d="M180 438 C250 616 314 641 370 641"/>
  <path class="dash-green" d="M812 580 V506"/>

  <!-- Semantic and actor -->
  <rect class="box" x="1028" y="122" width="204" height="412" fill="#fff7ed" stroke="#ea580c"/>
  <text class="section" x="1052" y="150">POLICY INPUT</text>

  <rect class="inner" x="1052" y="174" width="156" height="52" fill="#fffbeb" stroke="#f59e0b"/>
  <text class="label" x="1076" y="198">actor obs</text>
  <text class="tiny" x="1076" y="214">standard proprio stack</text>

  <rect class="inner" x="1052" y="246" width="156" height="52" fill="#eff6ff" stroke="#2563eb"/>
  <text class="label" x="1076" y="270">z_t 24-d</text>
  <text class="tiny" x="1076" y="286">slow memory</text>

  <rect class="inner" x="1052" y="318" width="156" height="82" fill="#ecfdf5" stroke="#059669"/>
  <text class="label" x="1076" y="342">semantic 16-d</text>
  <text class="tiny" x="1076" y="360">state 8 + geometry 8</text>
  <text class="tiny" x="1076" y="376">height, SafeStride, trend</text>

  <rect class="inner" x="1052" y="438" width="156" height="58" fill="#fee2e2" stroke="#ef4444"/>
  <text class="label" x="1080" y="462">Actor MLP</text>
  <text class="small" x="1080" y="480">joint targets</text>

  <path class="plain-line" d="M1208 200 H1220 V467 H1210"/>
  <path class="plain-line" d="M1208 272 H1220"/>
  <path class="plain-line" d="M1208 359 H1220"/>
  <path class="arrow" d="M1220 467 H1210"/>
  <path class="arrow-green" d="M956 473 C996 473 1002 359 1050 359"/>
  <path class="arrow-blue" d="M902 205 C972 205 982 272 1050 272"/>
  <path class="arrow" d="M1130 496 V548"/>
  <text class="small" x="1095" y="574">actions</text>

  <!-- Compact callout for what is omitted -->
  <rect x="42" y="610" width="276" height="70" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text class="small" x="66" y="638">Common RL components are collapsed:</text>
  <text class="tiny" x="66" y="658">PPO objective, value function, action decoder</text>
</svg>
